<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TV</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <div class="stage">
      <video id="video" autoplay playsinline></video>

      <!--
        Chrome over the video. It hides itself when the remote is idle and comes
        back on any input, because a control sitting on top of the picture for
        the whole film is worse than no control at all.
      -->
      <div class="chrome" id="chrome">
        <div class="chrome-top">
          <!-- Leave, and hide/show the list. Both top left, as asked. -->
          <button class="ctl" id="back" title="Back to the launcher (Escape)" aria-label="Back to the launcher">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button class="ctl" id="toggle" title="Hide channels" aria-label="Hide channels" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="15" rx="2.5" />
              <path d="M9.5 4.5v15" />
            </svg>
          </button>
          <span class="chrome-name" id="chrome-name"></span>
        </div>

        <!--
          Two slides, not one long list. Picking a genre first keeps 453
          channels from being scrolled past to find the handful wanted.
        -->
        <div class="channels" id="channels">
          <div class="slide" id="slide-genres"></div>
          <div class="slide" id="slide-channels" hidden>
            <button class="slide-back" id="slide-back" aria-label="Back to genres">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
              <span id="slide-title">genres</span>
            </button>
            <div class="channels-inner" id="channels-inner"></div>
          </div>
        </div>
      </div>

      <!--
        Shown only when a channel genuinely is not playing, and it says what
        happened in words rather than showing an error code. Whether it counted
        towards hiding is stated too, because a geo-block is not the same as a
        channel that has gone.
      -->
      <div class="problem" id="problem" hidden>
        <p class="problem-title" id="problem-title">This channel isn’t playing</p>
        <p class="problem-detail" id="problem-detail">Checking…</p>
        <p class="problem-counted" id="problem-counted" hidden></p>
        <div class="problem-actions">
          <button class="pbtn" id="problem-retry">Try again</button>
          <button class="pbtn" id="problem-hide">Hide this channel</button>
        </div>
        <p class="problem-hint">Press Escape to go back</p>
      </div>

      <div class="now" id="now" hidden><span id="now-name"></span><span id="now-res"></span></div>
    </div>

    <script src="../vendor/hlsjs/hls.min.js"></script>
    <script src="player.js"></script>
  </body>
</html>
